<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Glanceable Rayban PT visit HUD for Meta Ray-Ban Display glasses.">
  <meta name="mrbd-web-app-capable" content="yes">
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgo=">
  <title>Rayban PT Visit HUD</title>
  <script>
    (function () {
      var assetQuery = window.location.search || "";
      var stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = "styles.css" + assetQuery;
      document.head.appendChild(stylesheet);
    })();
  </script>
</head>
<body>
  <main id="app" class="app-root" aria-live="polite">
    <section id="home" class="screen" aria-label="Rayban PT visit HUD">
      <header class="hud-header panel">
        <div>
          <p class="eyebrow">Rayban PT</p>
          <h1>Visit HUD</h1>
        </div>
        <div class="connection" id="conn-status">
          <span class="conn-dot" id="conn-dot" aria-hidden="true"></span>
          <span id="conn-label">연결 중</span>
        </div>
      </header>

      <section class="patient-panel panel" aria-label="Session context">
        <div>
          <p class="meta-label">PATIENT ALIAS</p>
          <p class="patient-name" id="patient-name">미선택</p>
        </div>
        <div class="context-pills" aria-label="Visit readiness">
          <div class="session-pill" id="readiness-label">준비</div>
          <div class="session-pill" id="session-label">E0</div>
        </div>
      </section>

      <section class="phase-panel panel" aria-label="Visit phase">
        <div class="phase-chip" data-phase="pre_review">기록</div>
        <div class="phase-chip" data-phase="assessment">평가</div>
        <div class="phase-chip" data-phase="intervention">중재</div>
        <div class="phase-chip" data-phase="home_program">과제</div>
        <div class="phase-chip" data-phase="summary">요약</div>
      </section>

      <section class="status-panel panel" id="status-card" aria-label="Capture state">
        <div class="status-row">
          <span class="rec-dot hidden" id="rec-dot" aria-hidden="true"></span>
          <span class="status-kicker" id="status-kicker">STANDBY</span>
          <span class="rec-timer hidden" id="rec-timer">00:00</span>
        </div>
        <h2 id="status-title">화면 준비</h2>
        <p id="status-meta">라이브 연결을 기다리는 중</p>
        <p class="status-caption" id="status-caption">렌즈에는 최소 정보만 표시됩니다.</p>
      </section>

      <section class="cue-panel panel hidden" id="insight-card" aria-label="Latest cue">
        <div>
          <p class="meta-label">CUE</p>
          <p class="cue-title" id="insight-title">확인 필요</p>
          <p class="cue-body" id="insight-body"></p>
        </div>
        <div class="cue-time" id="insight-timer-bar" aria-hidden="true">
          <div id="insight-progress"></div>
        </div>
      </section>

      <nav class="command-rail" aria-label="HUD commands">
        <button class="focusable command-button primary" id="toggle-btn" data-action="toggle_recording">
          <span class="command-icon" aria-hidden="true">●</span>
          <span id="toggle-label">녹화 시작</span>
        </button>
        <button class="focusable command-button" data-action="select_patient">
          <span class="command-icon" aria-hidden="true">◇</span>
          <span>환자</span>
        </button>
        <button class="focusable command-button" data-action="show_recommendations">
          <span class="command-icon" aria-hidden="true">+</span>
          <span>큐</span>
        </button>
        <button class="focusable command-button" data-action="open_capture_history">
          <span class="command-icon" aria-hidden="true">≡</span>
          <span>기록</span>
        </button>
      </nav>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script>
    (function () {
      var assetQuery = window.location.search || "";
      var script = document.createElement("script");
      script.src = "app.js" + assetQuery;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
