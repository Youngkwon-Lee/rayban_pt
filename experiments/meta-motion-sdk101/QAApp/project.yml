name: MetaMotionMockQA
options:
  bundleIdPrefix: com.kinelo
  deploymentTarget:
    iOS: "17.6"
  xcodeVersion: "27.2"
packages:
  MetaWearablesDAT:
    url: https://github.com/meta/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  MetaMotionMockQA:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../MetaMotionMockSpike.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinelo.motionmockqa20261102
        PRODUCT_NAME: MetaMotionMockQA
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Meta Motion Mock QA
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: "Meta MockDeviceKit motion QA, simulated glasses only."
        NSBluetoothPeripheralUsageDescription: "Meta MockDeviceKit motion QA, simulated glasses only."
        NSLocalNetworkUsageDescription: "Meta MockDeviceKit motion QA requires SDK connectivity capability declarations."
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral, external-accessory]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        NSBonjourServices: ["_bonjour._tcp"]
        MWDAT:
          Analytics:
            OptOut: true
          AppLinkURLScheme: "motionmockqa://"
          MetaAppID: "0"
          ClientToken: "mock-only"
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATMotion
      - package: MetaWearablesDAT
        product: MWDATMockDevice
